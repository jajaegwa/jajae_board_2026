<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>자재과 마감관리</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<!-- 실시간 공유 동기화(Supabase) — 외부망 차단 환경에서는 로드 실패 → 자동 로컬 저장 모드 -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#eef1f4;--card:#ffffff;--ink:#18222c;--mut:#62717f;--line:#d6dde4;--line2:#eaeff3;
  --acc:#245c8f;--acc-soft:#e3eef8;--amber:#b9640f;--amber-soft:#fdf0df;--red:#b3261e;--red-soft:#fbe5e3;
  --green:#22733a;--green-soft:#e2f2e6;--navy:#17222d;--navy-ink:#e9eef3;--head:#f3f6f9;--row-hover:#f6f9fb;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131a21;--card:#1b242d;--ink:#e6ebf0;--mut:#98a6b3;--line:#2e3a46;--line2:#27323d;
  --acc:#7fb2e3;--acc-soft:#20344a;--amber:#f0a64a;--amber-soft:#3b2c14;--red:#f08c84;--red-soft:#3f2220;
  --green:#7fcf97;--green-soft:#1d3a27;--navy:#0e141a;--navy-ink:#e6ebf0;--head:#222d38;--row-hover:#212c37;
}}
:root[data-theme="dark"]{
  --bg:#131a21;--card:#1b242d;--ink:#e6ebf0;--mut:#98a6b3;--line:#2e3a46;--line2:#27323d;
  --acc:#7fb2e3;--acc-soft:#20344a;--amber:#f0a64a;--amber-soft:#3b2c14;--red:#f08c84;--red-soft:#3f2220;
  --green:#7fcf97;--green-soft:#1d3a27;--navy:#0e141a;--navy-ink:#e6ebf0;--head:#222d38;--row-hover:#212c37;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans KR','Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-size:14px;line-height:1.5}
.num,.mono{font-family:'IBM Plex Mono','Consolas',monospace;font-variant-numeric:tabular-nums}
header{background:var(--navy);color:var(--navy-ink);padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:17px;font-weight:700;letter-spacing:-.2px}
header .sub{font-size:12px;opacity:.7}
header .sp{flex:1}
header input[type=month]{background:transparent;color:var(--navy-ink);border:1px solid #4a5b6c;border-radius:6px;padding:4px 6px;font:inherit;font-size:13px;color-scheme:dark}
.savebox{font-size:12px;padding:4px 10px;border-radius:20px;border:1px solid #4a5b6c;display:flex;gap:6px;align-items:center}
.savebox i{width:8px;height:8px;border-radius:50%;background:#98a6b3;display:inline-block}
.savebox.ok i{background:#7fcf97}.savebox.ro i{background:#f0a64a}.savebox.local i{background:#7fb2e3}
nav{background:var(--navy);padding:0 20px;display:flex;gap:2px;overflow-x:auto}
nav button{background:transparent;border:none;color:#9fb0c0;padding:10px 14px;font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:#fff;border-bottom-color:var(--amber)}
nav button .b{display:inline-block;min-width:18px;padding:0 5px;border-radius:10px;background:var(--amber);color:#1a1208;font-size:11px;margin-left:5px;text-align:center}
main{max-width:1500px;margin:18px auto;padding:0 20px 60px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr));align-items:start}
.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.card h2{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card h2 .cnt{font-size:12px;color:var(--mut);font-weight:500}
.card .hint{font-size:12.5px;color:var(--mut);margin-bottom:10px;line-height:1.6}
.tbl{overflow:auto}
table{width:100%;border-collapse:collapse}
th{background:var(--head);color:var(--mut);font-size:11.5px;font-weight:600;text-align:left;padding:7px 8px;border-top:2px solid var(--ink);border-bottom:1px solid var(--line);position:sticky;top:0;white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line2);font-size:13px;vertical-align:middle;white-space:nowrap}
td.num,th.num{text-align:right}
tr:hover td{background:var(--row-hover)}
.pill{display:inline-block;padding:1px 8px;border-radius:12px;font-size:11.5px;font-weight:600}
.pill.g{background:var(--green-soft);color:var(--green)}
.pill.a{background:var(--amber-soft);color:var(--amber)}
.pill.r{background:var(--red-soft);color:var(--red)}
.pill.b{background:var(--acc-soft);color:var(--acc)}
.pill.m{background:var(--line2);color:var(--mut)}
.btn{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.ghost{background:transparent}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar input[type=search],.bar select,.bar input[type=text]{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:6px 10px;font:inherit;font-size:13px}
.prog{width:74px;height:8px;border-radius:5px;background:var(--line2);overflow:hidden;display:inline-block;vertical-align:middle}
.prog i{display:block;height:100%;background:var(--acc)}
.prog.done i{background:var(--green)}
.pct{font-size:11.5px;color:var(--mut);margin-left:5px}
input[type=checkbox].ck{width:17px;height:17px;accent-color:var(--acc);cursor:pointer}
td input[type=date],td select{background:transparent;border:1px solid var(--line);border-radius:5px;color:var(--ink);padding:2px 4px;font:inherit;font-size:12px;max-width:120px}
.vname{font-weight:700;cursor:pointer}
.vname:hover{color:var(--acc)}
.vsub{font-size:11.5px;color:var(--mut)}
.detail td{background:var(--head)!important;white-space:normal}
.detail .dbox{display:flex;gap:24px;flex-wrap:wrap;padding:4px 2px;font-size:12.5px}
.detail .dbox b{color:var(--mut);font-weight:600;margin-right:6px}
.stat{display:flex;gap:18px;flex-wrap:wrap}
.stat .it{min-width:110px}
.stat .v{font-size:24px;font-weight:700;letter-spacing:-.5px}
.stat .v small{font-size:13px;font-weight:500;color:var(--mut)}
.stat .k{font-size:12px;color:var(--mut)}
.hbar{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.hbar .row{display:flex;align-items:center;gap:8px;font-size:12.5px}
.hbar .lb{width:110px;color:var(--mut);text-align:right;flex:none}
.hbar .tr{flex:1;height:12px;background:var(--line2);border-radius:4px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--amber)}
.hbar .n{width:34px;font-size:11.5px;color:var(--mut)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);padding:20px;min-width:340px;max-width:94vw}
dialog::backdrop{background:rgba(10,16,22,.45)}
dialog h3{font-size:15px;margin-bottom:12px}
dialog label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
dialog input,dialog select,dialog textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:7px 9px;font:inherit;font-size:13px}
dialog .acts{display:flex;gap:8px;margin-top:16px;justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--navy);color:var(--navy-ink);padding:9px 18px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#toast.on{opacity:1}
pre.sql{background:var(--head);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:12px;overflow:auto;white-space:pre;line-height:1.5}
.mut{color:var(--mut)}
@media(max-width:720px){main{padding:0 10px 60px}header{padding:10px 12px}nav{padding:0 8px}}
</style>
</head>
<body>

<header>
  <h1>자재과 마감관리</h1>
  <span class="sub">사급(매각) 매출 · 매입 월마감 + 발주-입고 대사</span>
  <span class="sp"></span>
  <label class="sub" for="monPick">마감월</label>
  <input type="month" id="monPick">
  <span class="savebox local" id="saveBox"><i></i><span id="saveTxt">로컬 저장</span></span>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="toast"></div>

<dialog id="dlg"></dialog>

<script>
'use strict';
/* ===== 상수 ===== */
const SB_URL='https://druppuarqowdmskgldlw.supabase.co';
const SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydXBwdWFycW93ZG1za2dsZGx3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2MTE4OTcsImV4cCI6MjEwMzE4Nzg5N30.RIDSNGJfa0huV_MnpCbzToajuOo7KTDMckaSvf9oDYw';
const B_MAGAM='jajae-magam', B_MAIN='jajae-main';
const STEPS={
  sales:['수량일치','금액일치','매출입력','매출승인','수금','입금표전송','입금표수취','증빙'],
  purchase:['수량일치','금액일치','매입전표','매입승인','대금지급','계산서요청','계산서수취','증빙']
};
const SIDE_LB={sales:'사급(매각) 매출마감',purchase:'매입 마감'};
const VIAS=['','이메일','카카오톡','팩스','전화','기타'];
const today=new Date(),pad=n=>String(n).padStart(2,'0');
const curDate=`${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
let mon=curDate.slice(0,7);

/* ===== 상태 ===== */
function emptyState(){return{ver:1,vendors:{sales:[],purchase:[]},months:{}};}
const isObj=v=>v!==null&&typeof v==='object'&&!Array.isArray(v);
const arrOfObj=v=>Array.isArray(v)?v.filter(isObj):[];
/* 원격/가져오기 데이터는 남이 만든 페이로드 — 정규화 후에만 적용 */
function normalize(d){
  if(!isObj(d))return null;
  const vs=isObj(d.vendors)?d.vendors:{};
  const months={};
  if(isObj(d.months))Object.keys(d.months).forEach(m=>{
    const mm=d.months[m];if(!isObj(mm))return;
    const clean={};
    ['sales','purchase'].forEach(sd=>{
      clean[sd]={};
      if(isObj(mm[sd]))Object.keys(mm[sd]).forEach(vid=>{
        const e=mm[sd][vid];if(!isObj(e))return;
        clean[sd][vid]={sent:typeof e.sent==='string'?e.sent:'',via:typeof e.via==='string'?e.via:'',
          st:Array.isArray(e.st)?STEPS.sales.map((_,i)=>e.st[i]===true):STEPS.sales.map(()=>false),
          note:typeof e.note==='string'?e.note:''};
      });
    });
    months[m]=clean;
  });
  return{ver:1,vendors:{sales:arrOfObj(vs.sales),purchase:arrOfObj(vs.purchase)},months};
}
let S=(()=>{try{const v=normalize(JSON.parse(localStorage.getItem('magamDB')));if(v)return v;}catch(e){}return emptyState();})();

function ensureMonth(m){if(!S.months[m])S.months[m]={sales:{},purchase:{}};return S.months[m];}
function entry(side,vid,m){const mm=ensureMonth(m||mon);if(!mm[side][vid])mm[side][vid]={sent:'',via:'',st:STEPS.sales.map(()=>false),note:''};return mm[side][vid];}
function entryRO(side,vid,m){const mm=S.months[m||mon];return mm&&mm[side]&&mm[side][vid]?mm[side][vid]:{sent:'',via:'',st:STEPS.sales.map(()=>false),note:''};}
function pct(e){return e.st.filter(Boolean).length/8;}
function delayStep(side,e){const i=e.st.findIndex(x=>!x);return i<0?'':STEPS[side][i]+' 지연';}

/* ===== 저장 + Supabase 동기화 ===== */
const sbClientId=Math.random().toString(36).slice(2);
let sb=null,sbOK=false,sbApplying=false,sbSaveT=null,sbCh=null,sbChMain=null,sbPollT=null;
let sbPass=(()=>{try{return localStorage.getItem('jjPass')||'';}catch(e){return'';}})();
let mainOK=false;   // jajae-main(발주 데이터) 연결 여부
let orders=[];      // 작업판 발주 목록 (읽기 전용)

function saveDB(){
  try{localStorage.setItem('magamDB',JSON.stringify(S));}catch(e){}
  if(sbOK&&!sbApplying){clearTimeout(sbSaveT);sbSaveT=setTimeout(sbPush,700);}
}
async function sbPush(){
  if(!sb||!sbOK)return;
  try{
    const ok=await sb.rpc('set_board',{p_id:B_MAGAM,p_passcode:sbPass,p_data:S});
    if(ok.error||ok.data===false){setSave('ro','저장 실패 — 새로고침 필요');return;}
    setSave('ok','실시간 공유 중');
    try{sbCh?.send({type:'broadcast',event:'update',payload:{by:sbClientId,ts:Date.now()}});}catch(e){}
  }catch(e){setSave('ro','네트워크 오류');}
}
function sbApply(raw){
  const n=normalize(raw);if(!n)return false;
  sbApplying=true;
  try{S=n;try{localStorage.setItem('magamDB',JSON.stringify(S));}catch(e){}refreshAll();}finally{sbApplying=false;}
  return true;
}
function setSave(cls,txt){const b=document.getElementById('saveBox');b.className='savebox '+cls;document.getElementById('saveTxt').textContent=txt;}
function sbInit(){
  try{if(typeof supabase!=='undefined')sb=supabase.createClient(SB_URL,SB_ANON,{realtime:{params:{eventsPerSecond:2}}});}catch(e){}
  if(!sb){setSave('local','로컬 저장 (오프라인)');return;}
  if(sbPass)sbConnect(sbPass);else setSave('local','로컬 저장 — 우측 하단 [연결]');
}
async function sbConnect(pass){
  if(!sb)return;
  sbPass=pass;
  let magam=null,main=null;
  try{
    const r1=await sb.rpc('get_board',{p_id:B_MAGAM,p_passcode:pass});magam=r1.error?undefined:r1.data;
    const r2=await sb.rpc('get_board',{p_id:B_MAIN,p_passcode:pass});main=r2.error?undefined:r2.data;
  }catch(e){toast('연결 실패 — 네트워크 확인');return;}
  if(main===null&&magam===null){toast('비밀번호가 올바르지 않습니다');try{localStorage.removeItem('jjPass');}catch(e){}sbPass='';return;}
  try{localStorage.setItem('jjPass',pass);}catch(e){}
  if(main&&isObj(main)){mainOK=true;orders=arrOfObj(main.orders);}
  if(magam===null||magam===undefined){
    // 마감 보드가 아직 없음 — 발주 연동만 켠 로컬 모드
    setSave('ro','발주 연동됨 · 마감 보드 미생성(설정 탭 참고)');
    sbWatchMain();refreshAll();return;
  }
  sbOK=true;
  const remoteHas=isObj(magam)&&(arrOfObj((magam.vendors||{}).sales).length||arrOfObj((magam.vendors||{}).purchase).length||Object.keys(magam.months||{}).length);
  const localHas=S.vendors.sales.length||S.vendors.purchase.length;
  if(remoteHas)sbApply(magam);
  else if(localHas){await sbPush();}   // 최초 1회: 로컬(시드) 업로드
  setSave('ok','실시간 공유 중');
  sbCh=sb.channel('board-'+B_MAGAM).on('broadcast',{event:'update'},async({payload})=>{
    if(payload&&payload.by===sbClientId)return;
    try{const{data}=await sb.rpc('get_board',{p_id:B_MAGAM,p_passcode:sbPass});if(data)sbApply(data);}catch(e){}
  }).subscribe();
  sbWatchMain();
  clearInterval(sbPollT);
  sbPollT=setInterval(async()=>{
    try{const{data}=await sb.rpc('get_board',{p_id:B_MAGAM,p_passcode:sbPass});if(data&&sbOK&&!sbSaveT)sbApply(data);}catch(e){}
    fetchOrders();
  },45000);
  refreshAll();
}
function sbWatchMain(){
  if(!sb||sbChMain)return;
  sbChMain=sb.channel('board-'+B_MAIN).on('broadcast',{event:'update'},()=>fetchOrders()).subscribe();
  if(!sbPollT)sbPollT=setInterval(fetchOrders,60000);
}
async function fetchOrders(){
  if(!sb||!sbPass)return;
  try{const{data}=await sb.rpc('get_board',{p_id:B_MAIN,p_passcode:sbPass});
    if(data&&isObj(data)){mainOK=true;orders=arrOfObj(data.orders);renderView();}}catch(e){}
}
function askConnect(){
  const p=prompt('부서 공유 비밀번호를 입력하세요 (자재과 작업판과 동일)');
  if(p==null||!p.trim())return;
  sbConnect(p.trim());
}

/* ===== 발주-입고 매칭 ===== */
const nrm=s=>(s||'').toString().toUpperCase().replace(/[\s()（）·.,\-–—_/&]/g,'');
function vKeys(v){return [v.name,...(v.alias||'').split(',')].map(nrm).filter(k=>k.length>=2);}
function vmatch(v,field){
  const f=nrm(field);if(!f)return false;
  return vKeys(v).some(k=>f===k||f.includes(k)||(k.includes(f)&&f.length>=2));
}
function linkOf(side,v){
  const src=orders.filter(o=>!o.skip&&(side==='sales'?(o.type==='consign'&&vmatch(v,o.dest)):(o.type==='self'&&vmatch(v,o.vendor))));
  const inMon=src.filter(o=>(o.ordDate||'').slice(0,7)===mon);
  const open=src.filter(o=>!o.inDate);
  const late=open.filter(o=>o.eta&&o.eta<curDate);
  return{cnt:inMon.length,inCnt:inMon.filter(o=>o.inDate).length,open,late};
}
function linkBadge(side,v){
  if(!mainOK)return'<span class="pill m">연동 안됨</span>';
  const L=linkOf(side,v);
  if(!L.cnt&&!L.open.length)return'<span class="pill m">발주 없음</span>';
  let h='';
  if(L.cnt)h+=`<span class="pill b">${mon.slice(5)}월 ${L.cnt}건</span> `;
  if(L.open.length)h+=`<span class="pill ${L.late.length?'r':'a'}">미입고 ${L.open.length}건</span>`;
  else h+=`<span class="pill g">전량 입고</span>`;
  return h;
}

/* ===== 화면 ===== */
const VIEWS=[['dash','대시보드'],['sales','사급 매출마감'],['purchase','매입 마감'],['setup','데이터·설정']];
let view='dash';
const flt={sales:{q:'',st:'',who:''},purchase:{q:'',st:'',who:''}};
function esc(s){return (s||'').toString().replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function renderNav(){
  const n=document.getElementById('nav');
  n.innerHTML=VIEWS.map(([k,lb])=>{
    let b='';
    if(k==='sales'||k==='purchase'){
      const miss=S.vendors[k].filter(v=>pct(entryRO(k,v.id))<1).length;
      if(S.vendors[k].length)b=`<span class="b">${miss}</span>`;
    }
    return`<button class="${view===k?'on':''}" onclick="setView('${k}')">${lb}${b}</button>`;
  }).join('');
}
function setView(v){view=v;renderNav();renderView();}
function refreshAll(){renderNav();renderView();}

function renderView(){
  const m=document.getElementById('main');
  if(view==='dash')m.innerHTML=dashHTML();
  else if(view==='setup')m.innerHTML=setupHTML();
  else m.innerHTML=listHTML(view);
}

/* --- 대시보드 --- */
function sideStat(side){
  const vs=S.vendors[side];
  const es=vs.map(v=>entryRO(side,v.id));
  const done=es.filter(e=>pct(e)===1).length;
  const avg=vs.length?es.reduce((a,e)=>a+pct(e),0)/vs.length:0;
  const dist={};es.forEach(e=>{const d=delayStep(side,e);if(d)dist[d]=(dist[d]||0)+1;});
  return{total:vs.length,done,avg,dist};
}
function dashHTML(){
  const s1=sideStat('sales'),s2=sideStat('purchase');
  const openAll=side=>S.vendors[side].map(v=>({v,L:linkOf(side,v)})).filter(x=>x.L.open.length);
  const o1=mainOK?openAll('sales'):[],o2=mainOK?openAll('purchase'):[];
  const distBar=(side,st)=>{
    const max=Math.max(1,...Object.values(st.dist));
    const order=STEPS[side].map(x=>x+' 지연').filter(k=>st.dist[k]);
    return order.length?`<div class="hbar">${order.map(k=>`<div class="row"><span class="lb">${k.replace(' 지연','')}</span><span class="tr"><i style="width:${st.dist[k]/max*100}%"></i></span><span class="n num">${st.dist[k]}</span></div>`).join('')}</div>`:'<div class="mut" style="font-size:12.5px">지연 항목 없음</div>';
  };
  const statCard=(side,st)=>`<div class="card"><h2>${SIDE_LB[side]} <span class="cnt">${mon}</span></h2>
    <div class="stat">
      <div class="it"><div class="v num">${Math.round(st.avg*100)}<small>%</small></div><div class="k">평균 진행률</div></div>
      <div class="it"><div class="v num">${st.done}<small> / ${st.total}</small></div><div class="k">마감 완료 업체</div></div>
      <div class="it"><div class="v num">${st.total-st.done}</div><div class="k">미완</div></div>
    </div>
    <div style="margin-top:12px"><div class="k mut" style="font-size:12px;margin-bottom:2px">지연단계 분포 (미완 업체)</div>${distBar(side,st)}</div>
    <div style="margin-top:12px"><button class="btn sm" onclick="setView('${side}')">체크리스트 열기 →</button></div></div>`;
  const openCard=(t,list,side)=>`<div class="card"><h2>${t} <span class="cnt">${mainOK?list.length+'개 업체':'연동 필요'}</span></h2>
    ${mainOK?(list.length?`<div class="tbl"><table><tr><th>업체</th><th class="num">미입고</th><th>품목 (착일)</th></tr>${
      list.sort((a,b)=>b.L.open.length-a.L.open.length).map(x=>`<tr><td class="vname" onclick="setView('${side}')">${esc(x.v.name)}</td><td class="num">${x.L.open.length}건${x.L.late.length?` <span class="pill r">지연 ${x.L.late.length}</span>`:''}</td><td style="white-space:normal;font-size:12px" class="mut">${x.L.open.slice(0,4).map(o=>`${esc(o.item)} ${o.qty||''}${esc(o.unit||'')}${o.eta?`(${o.eta.slice(5)})`:''}`).join(' · ')}${x.L.open.length>4?' 외':''}</td></tr>`).join('')
    }</table></div>`:'<div class="mut" style="font-size:13px">발주분 전량 입고 완료 ✓</div>')
    :'<div class="mut" style="font-size:13px">작업판 발주 데이터 연동이 필요합니다 — 우측 하단 [연결] 또는 설정 탭.</div>'}</div>`;
  return`<div class="grid g2">
    ${statCard('sales',s1)}${statCard('purchase',s2)}
    ${openCard('사급 출고분 미입고 (사급발주 대사)',o1,'sales')}
    ${openCard('자가 발주분 미입고 (발주 대사)',o2,'purchase')}
  </div>
  ${!S.vendors.sales.length&&!S.vendors.purchase.length?`<div class="card" style="margin-top:14px"><h2>시작하기</h2><div class="hint">업체 목록이 비어 있습니다. <b>데이터·설정</b> 탭에서 <b>마감-시드.json 가져오기</b>로 업체·7월 진행 데이터를 불러오세요.</div><button class="btn pri" onclick="setView('setup')">데이터·설정 열기</button></div>`:''}`;
}

/* --- 체크리스트 --- */
function whoList(side){
  const set=new Set();
  S.vendors[side].forEach(v=>((side==='sales'?v.handler:v.buyer)||'').split('/').forEach(x=>{x=x.trim();if(x)set.add(x);}));
  return[...set].sort();
}
function listHTML(side){
  const f=flt[side];
  const rows=S.vendors[side].filter(v=>{
    const e=entryRO(side,v.id);
    if(f.q&&!(v.name+v.type+v.items+v.handler+v.buyer).toUpperCase().includes(f.q.toUpperCase()))return false;
    if(f.st==='done'&&pct(e)<1)return false;
    if(f.st==='open'&&pct(e)===1)return false;
    if(f.who&&!((side==='sales'?v.handler:v.buyer)||'').includes(f.who))return false;
    return true;
  });
  const short=['수량','금액',...(side==='sales'?['매출입력','매출승인','수금','입금표전송','입금표수취']:['매입전표','매입승인','대금지급','계산서요청','계산서수취']),'증빙'];
  return`<div class="card">
  <h2>${SIDE_LB[side]} <span class="cnt">${mon} · ${rows.length}/${S.vendors[side].length}개 업체</span></h2>
  <div class="bar">
    <input type="search" placeholder="업체·품목·담당 검색" value="${esc(f.q)}" oninput="flt['${side}'].q=this.value;renderView()">
    <select onchange="flt['${side}'].st=this.value;renderView()">
      <option value="">전체</option><option value="open"${f.st==='open'?' selected':''}>미완만</option><option value="done"${f.st==='done'?' selected':''}>완료만</option>
    </select>
    <select onchange="flt['${side}'].who=this.value;renderView()">
      <option value="">담당 전체</option>${whoList(side).map(w=>`<option${f.who===w?' selected':''}>${esc(w)}</option>`).join('')}
    </select>
    <span class="sp" style="flex:1"></span>
    <button class="btn sm" onclick="addVendor('${side}')">+ 업체 추가</button>
    <button class="btn sm" onclick="exportCSV('${side}')">CSV 내보내기</button>
  </div>
  <div class="tbl"><table>
    <tr><th>업체명</th><th>유형·품목</th><th>${side==='sales'?'처리자':'구매팀'}</th><th>발주↔입고</th><th>보낸날짜</th><th>방식</th>${short.map(s=>`<th style="text-align:center">${s}</th>`).join('')}<th>진행률</th><th>상태</th><th></th></tr>
    ${rows.map(v=>rowHTML(side,v)).join('')}
  </table></div>
  <div class="hint" style="margin-top:8px">업체명 클릭 → 연락처·미입고 상세. 발주↔입고는 자재과 작업판 데이터와 실시간 대사(사급=사급처 출고분, 매입=매입처 발주분).</div>
  </div>`;
}
function rowHTML(side,v){
  const e=entryRO(side,v.id);
  const p=pct(e);
  const dl=delayStep(side,e);
  return`<tr>
    <td><span class="vname" onclick="toggleDetail('${side}','${v.id}',this)">${esc(v.name)}</span>${v.mgr?`<div class="vsub">${esc(v.mgr)}</div>`:''}</td>
    <td><div>${esc(v.type)||'<span class=mut>—</span>'}</div><div class="vsub">${esc(v.items)}</div></td>
    <td style="font-size:12.5px">${esc(side==='sales'?v.handler:v.buyer)||'<span class=mut>—</span>'}</td>
    <td>${linkBadge(side,v)}</td>
    <td><input type="date" value="${esc(e.sent)}" onchange="setSent('${side}','${v.id}','sent',this.value)"></td>
    <td><select onchange="setSent('${side}','${v.id}','via',this.value)">${VIAS.map(x=>`<option${e.via===x?' selected':''}>${x}</option>`).join('')}</select></td>
    ${e.st.map((c,i)=>`<td style="text-align:center"><input type="checkbox" class="ck"${c?' checked':''} onchange="setStep('${side}','${v.id}',${i},this.checked)"></td>`).join('')}
    <td><span class="prog${p===1?' done':''}"><i style="width:${p*100}%"></i></span><span class="pct num">${Math.round(p*100)}%</span></td>
    <td>${p===1?'<span class="pill g">완료</span>':`<span class="pill ${p>0?'a':'r'}">${dl||'미완'}</span>`}</td>
    <td><button class="btn sm ghost" onclick="editVendor('${side}','${v.id}')">✎</button></td>
  </tr>`;
}
function toggleDetail(side,vid,el){
  const tr=el.closest('tr');
  if(tr.nextElementSibling&&tr.nextElementSibling.classList.contains('detail')){tr.nextElementSibling.remove();return;}
  document.querySelectorAll('tr.detail').forEach(x=>x.remove());
  const v=S.vendors[side].find(x=>x.id===vid);if(!v)return;
  const L=mainOK?linkOf(side,v):null;
  const d=document.createElement('tr');d.className='detail';
  d.innerHTML=`<td colspan="18"><div class="dbox">
    <span><b>담당</b>${esc(v.mgr)||'—'}</span>
    <span><b>이메일</b>${v.email?`<a href="mailto:${esc(v.email.split(/[;,]/)[0].trim())}">${esc(v.email)}</a>`:'—'}</span>
    <span><b>전화</b>${esc(v.tel)||'—'}</span>
    ${v.alias?`<span><b>매칭명</b>${esc(v.alias)}</span>`:''}
    </div>${L&&L.open.length?`<div class="dbox" style="margin-top:4px"><span><b>미입고</b>${L.open.map(o=>`${esc(o.item)} ${o.qty||''}${esc(o.unit||'')} <span class="mut">(발주 ${esc((o.ordDate||'').slice(5))}${o.eta?` · 착 ${esc(o.eta.slice(5))}`:''})</span>`).join(' · ')}</span></div>`:''}</td>`;
  tr.after(d);
}
function setStep(side,vid,i,val){entry(side,vid).st[i]=!!val;saveDB();renderNav();renderView();}
function setSent(side,vid,k,val){entry(side,vid)[k]=val;saveDB();}

/* --- 업체 편집 --- */
const FIELDS=[['name','업체명'],['mgr','담당자'],['email','이메일'],['tel','전화번호'],['type','유형'],['handler','처리자'],['buyer','구매팀 담당자'],['items','구매 품목'],['alias','발주 매칭명 (쉼표로 여러 개 — 작업판 업체명과 다를 때)']];
function vendorDlg(title,v,onSave,onDel){
  const dlg=document.getElementById('dlg');
  dlg.innerHTML=`<h3>${title}</h3>${FIELDS.map(([k,lb])=>`<label>${lb}</label><input id="vf_${k}" value="${esc(v[k]||'')}">`).join('')}
  <div class="acts">${onDel?'<button class="btn danger" id="vDel">삭제</button>':''}<span style="flex:1"></span>
  <button class="btn" onclick="dlg.close()">취소</button><button class="btn pri" id="vSave">저장</button></div>`;
  dlg.querySelector('#vSave').onclick=()=>{
    FIELDS.forEach(([k])=>v[k]=dlg.querySelector('#vf_'+k).value.trim());
    if(!v.name){toast('업체명은 필수입니다');return;}
    onSave();dlg.close();saveDB();refreshAll();
  };
  if(onDel)dlg.querySelector('#vDel').onclick=()=>{if(confirm('이 업체를 삭제할까요? (월별 체크 이력도 함께 삭제)'))
    {onDel();dlg.close();saveDB();refreshAll();}};
  dlg.showModal();
}
function addVendor(side){
  const v={id:side[0]+Date.now().toString(36)};
  vendorDlg('업체 추가 — '+SIDE_LB[side],v,()=>S.vendors[side].push(v));
}
function editVendor(side,vid){
  const v=S.vendors[side].find(x=>x.id===vid);if(!v)return;
  vendorDlg('업체 수정',v,()=>{},()=>{
    S.vendors[side]=S.vendors[side].filter(x=>x.id!==vid);
    Object.values(S.months).forEach(mm=>{if(mm[side])delete mm[side][vid];});
  });
}

/* --- 데이터·설정 --- */
function setupHTML(){
  const sql=`insert into board_state (id, passcode, data)
values ('jajae-magam', '공유비밀번호', '{}'::jsonb)
on conflict (id) do nothing;`;
  return`<div class="grid g2">
  <div class="card"><h2>공유 연결</h2>
    <div class="hint">자재과 작업판과 같은 <b>부서 공유 비밀번호</b>로 연결하면 ① 작업판의 발주·입고 데이터 대사 ② 마감 체크 실시간 공유가 켜집니다.<br>현재 상태: <b>${sbOK?'실시간 공유 중':(mainOK?'발주 연동만 됨 (마감 보드 미생성)':'로컬 저장')}</b></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn pri" onclick="askConnect()">비밀번호로 연결</button>
      <button class="btn" onclick="fetchOrders();toast('발주 데이터 새로고침')">발주 데이터 새로고침</button>
    </div>
    ${mainOK&&!sbOK?`<div class="hint" style="margin-top:12px">마감 전용 보드가 아직 없습니다. Supabase SQL Editor에서 아래를 1회 실행하세요 ('공유비밀번호'를 실제 비밀번호로 교체):</div><pre class="sql">${sql}</pre><button class="btn sm" onclick="navigator.clipboard.writeText(\`${sql}\`).then(()=>toast('복사됨'))">SQL 복사</button>`:''}
  </div>
  <div class="card"><h2>데이터 가져오기 / 내보내기</h2>
    <div class="hint">최초 1회 <b>마감-시드.json</b>을 가져오면 업체 목록과 7월 진행 상황이 채워집니다. 이후에는 자동 저장·공유됩니다.</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn pri" onclick="document.getElementById('impFile').click()">JSON 가져오기 (시드/백업)</button>
      <input type="file" id="impFile" accept=".json" style="display:none" onchange="importJSON(this)">
      <button class="btn" onclick="exportJSON()">JSON 백업 내려받기</button>
      <button class="btn" onclick="exportCSV('sales')">사급 CSV</button>
      <button class="btn" onclick="exportCSV('purchase')">매입 CSV</button>
    </div>
    <div class="hint" style="margin-top:10px">업체 ${S.vendors.sales.length+S.vendors.purchase.length}곳 · 저장된 월: ${Object.keys(S.months).sort().join(', ')||'없음'}</div>
  </div>
  <div class="card"><h2>월 관리</h2>
    <div class="hint">상단의 <b>마감월</b>을 바꾸면 해당 월 체크리스트로 전환됩니다. 새 달은 빈 체크리스트로 자동 시작되고, 지난 달 기록은 그대로 보존됩니다.</div>
    <button class="btn danger" onclick="resetMonth()">현재 월(${mon}) 체크 초기화</button>
  </div>
  </div>`;
}
function importJSON(inp){
  const f=inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const n=normalize(JSON.parse(rd.result));
      if(!n){toast('형식이 올바르지 않습니다');return;}
      if((S.vendors.sales.length||S.vendors.purchase.length)&&!confirm('기존 데이터를 가져온 내용으로 교체할까요?'))return;
      S=n;saveDB();refreshAll();toast('가져오기 완료 — 업체 '+(S.vendors.sales.length+S.vendors.purchase.length)+'곳');
    }catch(e){toast('JSON을 읽을 수 없습니다');}
    inp.value='';
  };
  rd.readAsText(f);
}
function dl(name,txt,type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
function exportJSON(){dl(`마감백업-${curDate}.json`,JSON.stringify(S,null,1),'application/json')}
function exportCSV(side){
  const hd=['업체명','담당자','유형','처리자','구매팀','구매품목','보낸날짜','보낸방식',...STEPS[side],'진행률','상태','지연단계'];
  const lines=[hd.join(',')];
  S.vendors[side].forEach(v=>{
    const e=entryRO(side,v.id);
    const cell=s=>'"'+(s||'').toString().replace(/"/g,'""')+'"';
    lines.push([v.name,v.mgr,v.type,v.handler,v.buyer,v.items,e.sent,e.via,...e.st.map(x=>x?'O':''),Math.round(pct(e)*100)+'%',pct(e)===1?'완료':'미완',delayStep(side,e)].map(cell).join(','));
  });
  dl(`${side==='sales'?'사급매출마감':'매입마감'}-${mon}.csv`,'﻿'+lines.join('\r\n'),'text/csv');
}
function resetMonth(){
  if(!confirm(mon+' 체크리스트를 모두 해제할까요?'))return;
  S.months[mon]={sales:{},purchase:{}};saveDB();refreshAll();toast(mon+' 초기화됨');
}

/* ===== 기타 ===== */
let toastT=null;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600);}
document.getElementById('monPick').value=mon;
document.getElementById('monPick').onchange=e=>{if(e.target.value){mon=e.target.value;refreshAll();}};
document.getElementById('saveBox').style.cursor='pointer';
document.getElementById('saveBox').onclick=()=>{if(!sbOK)askConnect();};
refreshAll();
sbInit();
</script>
</body>
</html>
