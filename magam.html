<!-- 이번달 마감대상 업로드(더존 엑셀 리포트 파싱)용 — 로드 실패 시 업로드 버튼에서 안내 -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
/* jajae-board-erp 디자인 시스템(DESIGN.md) 준수 — 밝은 크롬, 시스템 한글 폰트, 2px 모서리,
   전체 셀 테두리 그리드, 아웃라인 칩. 다크 크롬은 토스트에만 허용. */
:root{
  --bg:#eef0f2;--card:#ffffff;--ink:#20262b;--mut:#6b7480;--line:#b9c0c6;--line2:#d8dde1;
  --acc:#2f6f61;--acc-soft:#e6efec;--amber:#a15a1c;--amber-soft:#f2e6d8;--red:#a83a2e;--red-soft:#f4e0dd;
  --green:#3a7d52;--green-soft:#e3ede6;--navy:#17222d;--navy-ink:#e9eef3;--head:#e9edef;--row-hover:#f2f4f5;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131a21;--card:#1b242d;--ink:#e6ebf0;--mut:#98a6b3;--line:#2e3a46;--line2:#27323d;
  --acc:#7fb2e3;--acc-soft:#20344a;--amber:#f0a64a;--amber-soft:#3b2c14;--red:#f08c84;--red-soft:#3f2220;
  --green:#7fcf97;--green-soft:#1d3a27;--navy:#0e141a;--navy-ink:#e6ebf0;--head:#222d38;--row-hover:#212c37;
}}
:root[data-theme="dark"]{
  --bg:#131a21;--card:#1b242d;--ink:#e6ebf0;--mut:#98a6b3;--line:#2e3a46;--line2:#27323d;
  --acc:#7fb2e3;--acc-soft:#20344a;--amber:#f0a64a;--amber-soft:#3b2c14;--red:#f08c84;--red-soft:#3f2220;
  --green:#7fcf97;--green-soft:#1d3a27;--navy:#0e141a;--navy-ink:#e6ebf0;--head:#222d38;--row-hover:#212c37;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Malgun Gothic','맑은 고딕','Apple SD Gothic Neo','Dotum',sans-serif;font-size:13px;font-weight:500;line-height:1.45}
.num,.mono{font-family:Consolas,'Courier New',monospace;font-variant-numeric:tabular-nums}
header{background:var(--card);color:var(--ink);border-bottom:1px solid var(--line);padding:9px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:15px;font-weight:700;letter-spacing:-.2px}
header .sub{font-size:11.5px;color:var(--mut)}
header .sp{flex:1}
header label{font-size:11px;font-weight:600;color:var(--mut)}
header input[type=month]{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:2px;padding:3px 6px;font:inherit;font-size:12.5px}
header input[type=month]:focus{outline:1px solid var(--acc)}
.savebox{font-size:11px;font-weight:600;padding:3px 9px;border-radius:2px;border:1px solid var(--line);color:var(--mut);display:flex;gap:6px;align-items:center;background:var(--head)}
.savebox i{width:8px;height:8px;border-radius:50%;background:var(--mut);display:inline-block}
.savebox.ok i{background:var(--green)}.savebox.ro i{background:var(--amber)}.savebox.local i{background:var(--acc)}
nav{background:var(--head);padding:8px 16px 0;display:flex;gap:3px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav button{background:var(--card);border:1px solid var(--line);border-bottom:none;color:var(--mut);padding:7px 14px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;border-radius:2px 2px 0 0;white-space:nowrap;margin-bottom:-1px}
nav button.on{background:var(--acc);border-color:var(--acc);color:#fff}
nav button .b{display:inline-block;min-width:17px;padding:0 4px;border-radius:2px;border:1px solid currentColor;font-size:10.5px;margin-left:5px;text-align:center;font-family:Consolas,monospace}
main{max-width:1800px;margin:14px auto;padding:0 16px 60px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr));align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:14px}
.card h2{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card h2 .cnt{font-size:11.5px;color:var(--mut);font-weight:500}
.card .hint{font-size:12px;color:var(--mut);margin-bottom:10px;line-height:1.55}
.tbl{overflow-x:auto}
/* 세로 스크롤 시 헤더행 고정 — overflow-x:auto만 있으면 overflow-y가 auto로 계산돼
   .tbl이 스크롤 컨테이너가 되고, sticky th가 페이지가 아닌 이 박스 기준으로 묶여
   높이 제한이 없으면 결국 헤더가 그대로 밀려 올라감. 높이를 제한해 박스 안에서
   스크롤되게 하면 그 안에서 헤더가 고정됨.
   이 표들은 <thead> 없이 첫 행이 th라서 tr:first-child th까지 함께 처리.
   사파리는 border-collapse:collapse 표에서 sticky를 지원하지 않아 separate로 전환. */
.tbl.scroll{max-height:560px;overflow:auto}
.tbl.scroll table{border-collapse:separate;border-spacing:0}
.tbl.scroll th,.tbl.scroll td{border-width:0 1px 1px 0}
.tbl.scroll tr>*:first-child{border-left-width:1px}
.tbl.scroll tr:first-child th{border-top-width:1px}
table{width:100%;border-collapse:collapse}
th{background:var(--head);color:var(--mut);font-size:11.5px;font-weight:700;text-align:left;padding:6px 8px;border:1px solid var(--line);position:sticky;top:0;white-space:nowrap;z-index:1}
td{padding:5px 8px;border:1px solid var(--line2);font-size:12.5px;vertical-align:middle;white-space:nowrap}
td b{font-weight:600}
td.num,th.num{text-align:right}
tr:hover td{background:var(--row-hover)}
.pill{display:inline-block;padding:0 7px;border-radius:2px;font-size:11px;font-weight:700;border:1px solid;background:transparent;line-height:1.6}
.pill.g{color:var(--green);border-color:var(--green)}
.pill.a{color:var(--amber);border-color:var(--amber)}
.pill.r{color:var(--red);border-color:var(--red)}
.pill.b{color:var(--acc);border-color:var(--acc)}
.pill.m{color:var(--mut);border-color:var(--line)}
.btn{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:2px;padding:5px 12px;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{color:#fff;opacity:.92}
.btn.sm{padding:2px 8px;font-size:12px}
.btn.ghost{background:transparent}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.bar input[type=search],.bar select,.bar input[type=text]{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:2px;padding:5px 9px;font:inherit;font-size:12.5px}
.bar input:focus,.bar select:focus,td input:focus,td select:focus{outline:1px solid var(--acc)}
.prog{width:70px;height:9px;border-radius:2px;background:var(--line2);border:1px solid var(--line);overflow:hidden;display:inline-block;vertical-align:middle}
.prog i{display:block;height:100%;background:var(--acc)}
.prog.done i{background:var(--green)}
.pct{font-size:11px;color:var(--mut);margin-left:5px}
input[type=checkbox].ck{width:16px;height:16px;accent-color:var(--acc);cursor:pointer}
td input[type=date],td select{background:var(--card);border:1px solid var(--line);border-radius:2px;color:var(--ink);padding:1px 3px;font:inherit;font-size:11.5px;max-width:116px}
.vname{font-weight:600;cursor:pointer}
.vname:hover{color:var(--acc);text-decoration:underline}
.vsub{font-size:11px;color:var(--mut)}
.detail td{background:var(--head)!important;white-space:normal}
.detail .dbox{display:flex;gap:22px;flex-wrap:wrap;padding:3px 2px;font-size:12px}
.detail .dbox b{color:var(--mut);font-weight:600;margin-right:6px}
.stat{display:flex;gap:16px;flex-wrap:wrap}
.stat .it{min-width:104px}
.stat .v{font-size:22px;font-weight:700;font-family:Consolas,'Courier New',monospace;font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px;font-weight:500;color:var(--mut)}
.stat .k{font-size:11.5px;color:var(--mut)}
.hbar{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.hbar .row{display:flex;align-items:center;gap:8px;font-size:12px}
.hbar .lb{width:104px;color:var(--mut);text-align:right;flex:none}
.hbar .tr{flex:1;height:11px;background:var(--line2);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.hbar .tr i{display:block;height:100%;background:var(--amber)}
.hbar .n{width:32px;font-size:11px;color:var(--mut)}
dialog{border:1px solid var(--line);border-radius:3px;background:var(--card);color:var(--ink);padding:18px;min-width:340px;max-width:94vw;box-shadow:0 8px 24px rgba(0,0,0,.2)}
dialog::backdrop{background:rgba(10,16,22,.4)}
dialog h3{font-size:14px;margin-bottom:10px}
dialog label{display:block;font-size:11px;font-weight:600;color:var(--mut);margin:7px 0 2px}
dialog input,dialog select,dialog textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:2px;color:var(--ink);padding:6px 8px;font:inherit;font-size:12.5px}
dialog input:focus{outline:1px solid var(--acc)}
dialog .acts{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--navy);color:var(--navy-ink);padding:8px 16px;border-radius:2px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99}
#toast.on{opacity:1}
pre.sql{background:var(--head);border:1px solid var(--line);border-radius:2px;padding:11px;font-size:11.5px;font-family:Consolas,'Courier New',monospace;overflow:auto;white-space:pre;line-height:1.5}
.mut{color:var(--mut)}
@media(max-width:720px){main{padding:0 8px 60px}header{padding:8px 10px}nav{padding:6px 8px 0}}
</style>
</head>

<header>
  <h1>자재과 마감관리</h1>
  <span class="sub">사급(매각) 매출 · 매입 월마감 + 발주-입고 대사</span>
  <span class="sp"></span>
  <label class="sub" for="monPick">마감월</label>
  <input type="month" id="monPick">

<nav id="nav"></nav>
<main id="main"></main>

<dialog id="dlg"></dialog>

<script>
'use strict';
/* ===== 상수 ===== */
const SB_URL='https://druppuarqowdmskgldlw.supabase.co';
const SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRydXBwdWFycW93ZG1za2dsZGx3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc2MTE4OTcsImV4cCI6MjEwMzE4Nzg5N30.RIDSNGJfa0huV_MnpCbzToajuOo7KTDMckaSvf9oDYw';
const B_MAGAM='jajae-magam', B_MAIN='jajae-main';
/* 노션 "08-3. AR/AP 마감 프로세스" 매뉴얼 기준 — 실제 마감 순서·체크포인트에 맞춤.
   사급(AR): 매출전표→전표증빙→매출승인→수금전표→수금증빙→입금표발행→입금표수취→증빙→회계보고(신은진 사원 메일)
   (입금표전송은 실사용상 불필요해 제외. 전표증빙·수금증빙은 매출전표·수금전표 각각의 증빙 여부를 따로 체크)
   매입(AP): 계산서수취→매입전표(PO전표)→매입승인(AP결재/일괄결재) — 대금지급·계산서요청은
   매뉴얼상 자재과 마감 범위 밖이라 제외 */
const STEPS={
  sales:['수량일치','금액일치','매출전표','전표증빙','매출승인','수금전표','수금증빙','입금표발행','입금표수취','증빙','회계보고'],
  purchase:['수량일치','금액일치','계산서수취','매입전표','매입승인']
};
/* 체크 칸이 많아서 구분이 안 되는 문제 — 흐름상 한 단계로 묶이는 항목들 사이에
   굵은 세로선을 그어 구역을 나눔. 값은 각 구역이 "시작하는" STEPS 인덱스.
   사급: [수량·금액] [매출전표·증빙·매출승인] [수금전표·증빙] [입금표발행·수취·증빙] [회계보고]
   체크 구역 전체는 진한 테두리로 감싸고, 그 안의 소구역 경계는 더 연한 선으로 구분. */
const STEP_GROUPS={sales:[2,5,7,10],purchase:[]};
function stepBorder(side,i,isLastRow){
  const n=STEPS[side].length;
  let s='';
  if(i===0)s+='border-left:2.5px solid var(--ink);';
  else if(STEP_GROUPS[side].includes(i))s+='border-left:1px solid var(--mut);';
  if(i===n-1)s+='border-right:2.5px solid var(--ink);';
  if(isLastRow)s+='border-bottom:2.5px solid var(--ink);';
  return s;
}
const SIDE_LB={sales:'사급(매각) 매출마감',purchase:'매입 마감'};
const VIAS=['','이메일','카카오톡','팩스','전화','기타'];
const today=new Date(),pad=n=>String(n).padStart(2,'0');
const curDate=`${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
let mon=curDate.slice(0,7);

/* ===== 상태 ===== */
function emptyState(){return{ver:1,vendors:{sales:[],purchase:[]},months:{}};}
const isObj=v=>v!==null&&typeof v==='object'&&!Array.isArray(v);
const arrOfObj=v=>Array.isArray(v)?v.filter(isObj):[];
/* 원격/가져오기 데이터는 남이 만든 페이로드 — 정규화 후에만 적용 */
function normalize(d){
  if(!isObj(d))return null;
  const vs=isObj(d.vendors)?d.vendors:{};
  const months={};
  if(isObj(d.months))Object.keys(d.months).forEach(m=>{
    const mm=d.months[m];if(!isObj(mm))return;
    const clean={};
    ['sales','purchase'].forEach(sd=>{
      clean[sd]={};
      if(isObj(mm[sd]))Object.keys(mm[sd]).forEach(vid=>{
        const e=mm[sd][vid];if(!isObj(e))return;
        clean[sd][vid]={sent:typeof e.sent==='string'?e.sent:'',via:typeof e.via==='string'?e.via:'',
          st:Array.isArray(e.st)?STEPS.sales.map((_,i)=>e.st[i]===true):STEPS.sales.map(()=>false),
          note:typeof e.note==='string'?e.note:'',toBuyer:e.toBuyer===true};
      });
    });
    /* 이번달만 제외한 업체 — 완전 삭제가 아니라 이번달 목록에서만 숨김(다음달엔 다시 보임) */
    const ex=isObj(mm.excluded)?mm.excluded:{};
    clean.excluded={sales:Array.isArray(ex.sales)?ex.sales.filter(x=>typeof x==='string'):[],
      purchase:Array.isArray(ex.purchase)?ex.purchase.filter(x=>typeof x==='string'):[]};
    /* 이번달 마감대상(업로드 파일 분석 결과) — 업체 id 배열 + 요약 메타 */
    const tg=isObj(mm.targets)?mm.targets:{};
    clean.targets={sales:Array.isArray(tg.sales)?tg.sales.filter(x=>typeof x==='string'):null,
      purchase:Array.isArray(tg.purchase)?tg.purchase.filter(x=>typeof x==='string'):null};
    const tgm=isObj(mm.targetsMeta)?mm.targetsMeta:{};
    clean.targetsMeta={};
    ['sales','purchase'].forEach(sd=>{
      const m2=tgm[sd];
      clean.targetsMeta[sd]=isObj(m2)?{fileName:typeof m2.fileName==='string'?m2.fileName:'',
        at:typeof m2.at==='string'?m2.at:'',total:Number.isFinite(m2.total)?m2.total:0,
        matched:Number.isFinite(m2.matched)?m2.matched:0,created:Number.isFinite(m2.created)?m2.created:0,
        unmatched:Array.isArray(m2.unmatched)?m2.unmatched.filter(x=>typeof x==='string'):[],
        names:Array.isArray(m2.names)?m2.names.filter(x=>typeof x==='string'):[]}:null;
    });
    months[m]=clean;
  });
  return{ver:1,vendors:{sales:arrOfObj(vs.sales),purchase:arrOfObj(vs.purchase)},months};
}
let S=(()=>{try{const v=normalize(JSON.parse(localStorage.getItem('magamDB')));if(v)return v;}catch(e){}return emptyState();})();

function ensureMonth(m){
  if(!S.months[m])S.months[m]={sales:{},purchase:{},targets:{sales:null,purchase:null},targetsMeta:{sales:null,purchase:null},excluded:{sales:[],purchase:[]}};
  const mm=S.months[m];
  // 예전 데이터나 초기화 직후엔 하위 객체가 빠져 있을 수 있어 항상 채워둠(업로드 시 TypeError 방지)
  if(!mm.excluded)mm.excluded={sales:[],purchase:[]};
  if(!mm.targets)mm.targets={sales:null,purchase:null};
  if(!mm.targetsMeta)mm.targetsMeta={sales:null,purchase:null};
  return mm;
}
function entry(side,vid,m){const mm=ensureMonth(m||mon);if(!mm[side][vid])mm[side][vid]={sent:'',via:'',st:STEPS.sales.map(()=>false),note:'',toBuyer:false};return mm[side][vid];}
function entryRO(side,vid,m){const mm=S.months[m||mon];return mm&&mm[side]&&mm[side][vid]?mm[side][vid]:{sent:'',via:'',st:STEPS.sales.map(()=>false),note:'',toBuyer:false};}
/* 매입 금액이 안 맞으면 자재과가 아니라 구매팀이 월말에 마감 처리함 — toBuyer로 표시해두면
   그 업체는 자재과 미완료 집계에서 빠지고(완료로 취급) "구매팀 처리 예정"으로 따로 표시됨 */
function pct(side,e){if(side==='purchase'&&e.toBuyer)return 1;const n=STEPS[side].length;return e.st.slice(0,n).filter(Boolean).length/n;}
function delayStep(side,e){if(e.toBuyer)return'';const n=STEPS[side].length;const i=e.st.slice(0,n).findIndex(x=>!x);return i<0?'':STEPS[side][i]+' 지연';}

/* ===== 저장 + Supabase 동기화 ===== */
const sbClientId=Math.random().toString(36).slice(2);
let sb=null,sbOK=false,sbApplying=false,sbSaveT=null,sbPushing=0,sbCh=null,sbChMain=null,sbPollT=null;
let sbPass=(()=>{try{return localStorage.getItem('jjPass')||'';}catch(e){return'';}})();
let mainOK=false;   // jajae-main(발주 데이터) 연결 여부
let orders=[];      // 작업판 발주 목록 (읽기 전용)

function saveDB(){
  try{localStorage.setItem('magamDB',JSON.stringify(S));}catch(e){}
  // sbSaveT는 실행 시 null로 되돌려야 45초 폴링이 첫 저장 뒤에도 계속 동작함.
  // 전송 중(sbPushing)에는 폴링이 서버의 옛 데이터로 방금 한 편집을 덮어쓰지 않게 막음
  if(sbOK&&!sbApplying){clearTimeout(sbSaveT);sbSaveT=setTimeout(async()=>{sbSaveT=null;sbPushing++;try{await sbPush();}finally{sbPushing--;}},700);}
}
async function sbPush(){
  if(!sb||!sbOK)return;
  try{
    const ok=await sb.rpc('set_board',{p_id:B_MAGAM,p_passcode:sbPass,p_data:S});
    if(ok.error||ok.data===false){setSave('ro','저장 실패 — 새로고침 필요');return;}
    setSave('ok','실시간 공유 중');
    try{sbCh?.send({type:'broadcast',event:'update',payload:{by:sbClientId,ts:Date.now()}});}catch(e){}
  }catch(e){setSave('ro','네트워크 오류');}
}
function sbApply(raw){
  const n=normalize(raw);if(!n)return false;
  sbApplying=true;
  try{S=n;try{localStorage.setItem('magamDB',JSON.stringify(S));}catch(e){}refreshAll();}finally{sbApplying=false;}

}

async function sbConnect(pass){
  if(!sb)return;
  sbPass=pass;
  let magam=null,main=null;
  try{
    const r1=await sb.rpc('get_board',{p_id:B_MAGAM,p_passcode:pass});magam=r1.error?undefined:r1.data;
    const r2=await sb.rpc('get_board',{p_id:B_MAIN,p_passcode:pass});main=r2.error?undefined:r2.data;
  }catch(e){toast('연결 실패 — 네트워크 확인');return;}
  // undefined = RPC 오류(네트워크 등), null = 보드 없음/비밀번호 불일치 — 오류일 땐 비밀번호를 저장하지 않고
  // "마감 보드 미생성"으로 오해하게 만들지 않음
  if(magam===undefined){setSave('local','연결 실패 — 네트워크 확인 후 다시 [연결]');toast('연결 실패 — 네트워크 확인');return;}
  if(main===null&&magam===null){toast('비밀번호가 올바르지 않습니다');try{localStorage.removeItem('jjPass');}catch(e){}sbPass='';return;}
  try{localStorage.setItem('jjPass',pass);}catch(e){}
  if(main&&isObj(main)){mainOK=true;orders=arrOfObj(main.orders);}
  if(magam===null||magam===undefined){
    // 마감 보드가 아직 없음 — 발주 연동만 켠 로컬 모드
    setSave('ro','발주 연동됨 · 마감 보드 미생성(설정 탭 참고)');
    sbWatchMain();refreshAll();return;
  }
  sbOK=true;
  const remoteHas=isObj(magam)&&(arrOfObj((magam.vendors||{}).sales).length||arrOfObj((magam.vendors||{}).purchase).length||Object.keys(magam.months||{}).length);
  const localHas=S.vendors.sales.length||S.vendors.purchase.length;
  if(remoteHas)sbApply(magam);
  else if(localHas){await sbPush();}   // 최초 1회: 로컬(시드) 업로드
  setSave('ok','실시간 공유 중');
  sbCh=sb.channel('board-'+B_MAGAM).on('broadcast',{event:'update'},async({payload})=>{
    if(payload&&payload.by===sbClientId)return;
    try{const{data}=await sb.rpc('get_board',{p_id:B_MAGAM,p_passcode:sbPass});if(data)sbApply(data);}catch(e){}
  }).subscribe();
  sbWatchMain();
  clearInterval(sbPollT);
  sbPollT=setInterval(async()=>{
    try{const{data}=await sb.rpc('get_board',{p_id:B_MAGAM,p_passcode:sbPass});if(data&&sbOK&&!sbSaveT&&!sbPushing)sbApply(data);}catch(e){}
    fetchOrders();
  },45000);
  refreshAll();
}

  if(!sb||sbChMain)return;

const nrm=s=>(s||'').toString().toUpperCase().replace(/[\s()（）·.,\-–—_/&]/g,'');
function vKeys(v){return [v.name,...(v.alias||'').split(',')].map(nrm).filter(k=>k.length>=2);}
function vmatch(v,field){
  const f=nrm(field);if(!f)return false;
  return vKeys(v).some(k=>f===k||f.includes(k)||(k.includes(f)&&f.length>=2));
}
function linkOf(side,v){
  const src=orders.filter(o=>!o.skip&&(side==='sales'?(o.type==='consign'&&vmatch(v,o.dest)):(o.type==='self'&&vmatch(v,o.vendor))));
  const inMon=src.filter(o=>(o.ordDate||'').slice(0,7)===mon);
  const open=src.filter(o=>!o.inDate);
  const late=open.filter(o=>o.eta&&o.eta<curDate);
  return{cnt:inMon.length,inCnt:inMon.filter(o=>o.inDate).length,open,late};
}
function linkBadge(side,v){
  if(!mainOK)return'<span class="pill m">연동 안됨</span>';
  const L=linkOf(side,v);
  if(!L.cnt&&!L.open.length)return'<span class="pill m">발주 없음</span>';
  let h='';
  if(L.cnt)h+=`<span class="pill b">${mon.slice(5)}월 ${L.cnt}건</span> `;
  if(L.open.length)h+=`<span class="pill ${L.late.length?'r':'a'}">미입고 ${L.open.length}건</span>`;
  else h+=`<span class="pill g">전량 입고</span>`;
  return h;
}

/* ===== 이번달 마감대상 업로드(더존 엑셀 리포트 분석) =====
   매입: "마감확인용(업체별)" 리포트 — 헤더 'Site Name' 열의 업체명(그룹 첫 행만, 'XXX Total' 행 제외)
   사급: "M_03_매각내역" 리포트 — 헤더 '매각업체명' 열, 동일한 그룹핑 규칙.
   업체명에 붙는 사업자번호"(1234567890)"·법인표기(주식회사/㈜/(주)/(유))는 매칭 전에 제거. */
const REPORT_COL={purchase:{idx:0,header:'Site Name',label:'마감확인용(업체별)'},sales:{idx:1,header:'매각업체명',label:'M_03_매각내역'}};
function stripBizForm(s){
  let x=(s||'').trim();
  x=x.replace(/\(\d{6,}\)\s*$/,'');
  x=x.replace(/(주식회사|㈜|\(주\)|\(유\))/g,'');
  return x.trim();
}
function extractGroupedNames(rows,colIdx,headerText){
  let hRow=-1;
  for(let i=0;i<rows.length;i++){
    if(rows[i]&&rows[i].some(c=>typeof c==='string'&&c.trim()===headerText)){hRow=i;break;}
  }
  if(hRow<0)return null;
  const names=[];
  for(let i=hRow+1;i<rows.length;i++){
    const v=rows[i]&&rows[i][colIdx];
    if(typeof v==='string'){
      const t=v.trim();
      if(t&&!/Total$/.test(t))names.push(t);
    }
  }
  return[...new Set(names)];
}
function matchFileName(name,side){
  const n=nrm(stripBizForm(name));if(!n)return{id:null};
  const same=S.vendors[side];
  const hit=v=>vKeys(v).some(k=>k===n)?1:(vKeys(v).some(k=>k.length>=2&&(n.includes(k)||k.includes(n)))?2:0);
  let best=null,bestScore=99;
  for(const v of same){const s=hit(v);if(s&&s<bestScore){best=v;bestScore=s;}}
  if(best)return{id:best.id,from:'same'};
  const other=side==='sales'?'purchase':'sales';
  best=null;bestScore=99;
  for(const v of S.vendors[other]){const s=hit(v);if(s&&s<bestScore){best=v;bestScore=s;}}
  if(best)return{id:null,twin:best,from:'other'};
  return{id:null};
}
function cloneVendorForSide(side,twin){
  const seq=(S._impSeq=(S._impSeq||0)+1);
  const v={id:side[0]+'a'+Date.now().toString(36)+seq,name:twin.name,mgr:twin.mgr||'',email:twin.email||'',
    tel:twin.tel||'',type:twin.type||'',handler:twin.handler||'',buyer:side==='purchase'?(twin.buyer||''):'',
    items:twin.items||'',alias:twin.alias||''};
  S.vendors[side].push(v);
  return v.id;
}
function processMonthlyFile(side,file){
  if(typeof XLSX==='undefined'){toast('엑셀 라이브러리 로드 실패 — 네트워크 확인 후 새로고침해서 다시 시도해주세요');return;}
  const rd=new FileReader();
  rd.onload=()=>{
    let rows;
    try{
      const wb=XLSX.read(new Uint8Array(rd.result),{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    }catch(e){toast('엑셀 파일을 읽을 수 없습니다');return;}
    const cfg=REPORT_COL[side];
    let names=extractGroupedNames(rows,cfg.idx,cfg.header);
    if(!names){
      const other=side==='sales'?'purchase':'sales';
      const alt=extractGroupedNames(rows,REPORT_COL[other].idx,REPORT_COL[other].header);
      toast(alt?`이 파일은 ${SIDE_LB[other]} 리포트(${REPORT_COL[other].label})로 보입니다 — ${SIDE_LB[other]} 탭에서 업로드해주세요`
        :`업체별 리포트 형식을 인식하지 못했습니다 (${cfg.label} 리포트를 올려주세요)`);
      return;
    }
    if(!names.length){toast('파일에서 업체명을 찾지 못했습니다');return;}
    const ids=new Set();let created=0;const unmatched=[];
    names.forEach(nm=>{
      const m=matchFileName(nm,side);
      if(m.id){ids.add(m.id);}
      else if(m.twin){ids.add(cloneVendorForSide(side,m.twin));created++;}
      else unmatched.push(nm);
    });
    const mm=ensureMonth(mon);
    mm.targets[side]=[...ids];
    mm.targetsMeta[side]={fileName:file.name,at:curDate,total:names.length,matched:ids.size-created,created,unmatched,names};
    tgtOnly[side]=true;
    saveDB();refreshAll();
    toast(`${SIDE_LB[side]} 마감대상 반영: ${names.length}곳 중 ${ids.size}곳 매칭`+(unmatched.length?` · 미매칭 ${unmatched.length}곳`:''));
  };
  rd.readAsArrayBuffer(file);
}
function uploadMonthly(side,inp){
  const f=inp.files[0];if(!f)return;
  processMonthlyFile(side,f);
  inp.value='';
}
function clearTargets(side){
  if(!confirm(mon+' '+SIDE_LB[side]+' 마감대상 업로드(파일 목록)를 삭제할까요?\n다시 쓰려면 엑셀을 다시 올려야 합니다. 체크 데이터는 유지됩니다.\n(잠깐 전체 업체를 보고 싶은 거라면 옆의 "마감대상만 보기" 체크만 끄면 됩니다)'))return;
  const mm=ensureMonth(mon);mm.targets[side]=null;mm.targetsMeta[side]=null;
  saveDB();refreshAll();
}

/* 45초/60초 주기 폴링·실시간 브로드캐스트(발주 데이터 등)가 검색창에 타이핑 중인
   화면을 통째로 다시 그려버리면 입력 중이던 DOM이 교체돼 조합이 끊기고 포커스가
   날아감 — 그래서 검색창에 포커스가 있는 동안은 배경 새로고침을 건너뛴다.
   (검색 자체의 재렌더링은 scheduleSearch가 별도로, 타이핑이 멈췄을 때만 수행) */
function isSearchFocused(){

/* 검색창 입력마다 큰 표 전체를 다시 그리면 느려지고, 한글 조합(IME) 중에 입력칸 DOM이
   통째로 교체되면서 조합이 끊겨 한 글자만 쳐지는 문제가 생김 — 그래서 타이핑이 잠깐
   멈췄을 때만 다시 그리고, 그 후 포커스·커서 위치를 검색창에 되돌려준다. */

function renderView(){tgtMemo={};

     표 안쪽 스크롤(.tbl.scroll)과 페이지 스크롤 위치를 저장했다가 다시 그린 뒤 복원 */

function addVendorFromUnmatched(side,nm){

/* 업로드 당시 저장해둔 업체 id는 다른 기기·시점의 업체 목록 변경으로 어긋날 수 있음 —
   그래서 id를 그대로 믿지 않고, 업로드 파일에서 뽑은 업체명 목록(targetsMeta.names)을
   지금 이 순간의 업체 목록(S.vendors)에 매번 새로 매칭해서 마감대상을 구한다. */
let tgtMemo={};   // 한 번의 화면 갱신 안에서 배지·대시보드·표가 같은 매칭을 여러 번 되풀이하지 않도록
function liveTgtIds(side,tm){
  if(!tm||!Array.isArray(tm.names)||!tm.names.length)return null;
  const c=tgtMemo[side];if(c&&c.tm===tm)return c.ids;
  const ids=new Set();
  tm.names.forEach(nm=>{const m=matchFileName(nm,side);if(m.id)ids.add(m.id);});
  tgtMemo[side]={tm,ids:[...ids]};
  return tgtMemo[side].ids;
}
/* 이번달 범위(제외 목록 + 마감대상 필터) — 체크리스트 표, 대시보드 집계, 탭 배지가 모두 같은
   기준을 써야 "표는 다 끝났는데 배지는 아직 남았다"는 불일치가 안 생김 */
function monthScope(side){
  const mmCur=S.months[mon];
  const tm=mmCur&&mmCur.targetsMeta?mmCur.targetsMeta[side]:null;
  const tgtLegacy=mmCur&&mmCur.targets?mmCur.targets[side]:null;
  const tgt=liveTgtIds(side,tm)||tgtLegacy;
  const tgtEmpty=!!(tm&&tm.names&&tm.names.length&&tgt&&!tgt.length);
  const applyTgt=!!(tgt&&tgt.length&&tgtOnly[side]);
  const excluded=(mmCur&&mmCur.excluded&&mmCur.excluded[side])||[];
  return{tm,tgt,tgtEmpty,applyTgt,excluded};
}
function inScope(side,v,sc){return !sc.excluded.includes(v.id)&&!(sc.applyTgt&&!sc.tgt.includes(v.id));}
function scopedVendors(side){const sc=monthScope(side);return S.vendors[side].filter(v=>inScope(side,v,sc));}
function clearFilters(side){
  flt[side]={q:'',st:'',who:'',ty:'',buyer:''};tgtOnly[side]=false;dashWho='';
  renderView();toast('필터를 모두 해제했습니다');
}

        ${[sc.applyTgt?'마감대상만 보기':'',f.q?`검색 "${esc(f.q)}"`:'',f.st?(f.st==='done'?'완료만':'미완만'):'',f.who?`처리자 ${esc(f.who)}`:'',f.buyer?`구매팀 ${esc(f.buyer)}`:'',f.ty?`유형 ${esc(f.ty)}`:'',excluded.length?`이번달 제외 ${excluded.length}곳`:''].filter(Boolean).map(x=>`<span class="pill m">${x}</span>`).join(' ')||''}

function rowHTML(side,v,isLast){

function toggleDetail(side,vid,el){
  const tr=el.closest('tr');
  if(tr.nextElementSibling&&tr.nextElementSibling.classList.contains('detail')){tr.nextElementSibling.remove();return;}
  document.querySelectorAll('tr.detail').forEach(x=>x.remove());
  const v=S.vendors[side].find(x=>x.id===vid);if(!v)return;
  const L=mainOK?linkOf(side,v):null;
  const d=document.createElement('tr');d.className='detail';
  d.innerHTML=`<td colspan="23"><div class="dbox">
    <span><b>담당</b>${esc(v.mgr)||'—'}</span>
    <span><b>이메일</b>${v.email?`<a href="mailto:${esc(v.email.split(/[;,]/)[0].trim())}">${esc(v.email)}</a>`:'—'}</span>
    <span><b>전화</b>${esc(v.tel)||'—'}</span>
    ${v.alias?`<span><b>매칭명</b>${esc(v.alias)}</span>`:''}
    </div>${L&&L.open.length?`<div class="dbox" style="margin-top:4px"><span><b>미입고</b>${L.open.map(o=>`${esc(o.item)} ${o.qty||''}${esc(o.unit||'')} <span class="mut">(발주 ${esc((o.ordDate||'').slice(5))}${o.eta?` · 착 ${esc(o.eta.slice(5))}`:''})</span>`).join(' · ')}</span></div>`:''}</td>`;
  tr.after(d);
}
function setStep(side,vid,i,val){entry(side,vid).st[i]=!!val;saveDB();renderNav();renderView();}
function setSent(side,vid,k,val){entry(side,vid)[k]=val;saveDB();}
function setToBuyer(side,vid,val){entry(side,vid).toBuyer=!!val;saveDB();renderNav();renderView();}
/* 매출승인처럼 결재를 한 번에 몰아서 하는 단계는 업체마다 하나씩 체크하는 게 번거로움 —
   헤더를 클릭하면 지금 화면에 보이는(필터링된) 업체 전체를 한 번에 체크 */
function bulkCheckStep(side,i){
  const label=STEPS[side][i];
  const ids=[...document.querySelectorAll('.tbl.scroll input.vsel')].map(el=>el.dataset.id);
  if(!ids.length){toast('체크할 업체가 없습니다');return;}
  if(!confirm(`지금 보이는 업체 ${ids.length}곳의 "${label}"을(를) 한 번에 체크할까요?`))return;
  ids.forEach(id=>{entry(side,id).st[i]=true;});
  saveDB();renderNav();renderView();
  toast(`${ids.length}곳 "${label}" 일괄 체크 완료`);
}

function vendorDlg(title,v,onSave,onDel){
  const dlg=document.getElementById('dlg');
  dlg.innerHTML=`<h3>${title}</h3>${FIELDS.map(([k,lb])=>`<label>${lb}</label><input id="vf_${k}" value="${esc(v[k]||'')}">`).join('')}
  <div class="acts">${onDel?'<button class="btn danger" id="vDel">삭제</button>':''}<span style="flex:1"></span>
  <button class="btn" onclick="dlg.close()">취소</button><button class="btn pri" id="vSave">저장</button></div>`;
  dlg.querySelector('#vSave').onclick=()=>{
    // 검증을 통과한 뒤에만 실제 업체 객체(v)에 써야 함 — 먼저 덮어쓰면 업체명을 지우고 취소해도
    // 메모리상 업체가 이름 없이 남아 다음 저장 때 그대로 공유됨
    const vals={};FIELDS.forEach(([k])=>vals[k]=dlg.querySelector('#vf_'+k).value.trim());
    if(!vals.name){toast('업체명은 필수입니다');dlg.querySelector('#vf_name').focus();return;}
    Object.assign(v,vals);
    onSave();dlg.close();saveDB();refreshAll();
  };
  if(onDel)dlg.querySelector('#vDel').onclick=()=>{if(confirm(`"${v.name}" 업체를 삭제할까요?\n(모든 달의 체크 이력도 함께 삭제됩니다 — 이번달만 빼려면 목록에서 "선택 제외"를 쓰세요)`))
    {onDel();dlg.close();saveDB();refreshAll();}};
  dlg.showModal();
}
/* 업체 추가/수정 창에서 Enter = 저장. 입력칸에 있을 때(또는 창 자체에 포커스가 있을 때)만이고,
   버튼에 포커스가 있을 땐 그 버튼의 원래 동작. 저장 버튼(#vSave)이 없는 창(제외 목록 등)에선 아무 일도 안 함. */
document.getElementById('dlg').addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const t=e.target.tagName;
  if(t!=='INPUT'&&t!=='DIALOG')return;
  const save=e.currentTarget.querySelector('#vSave');
  if(!save)return;
  e.preventDefault();save.click();
});
function addVendor(side){
  const v={id:side[0]+Date.now().toString(36)};
  vendorDlg('업체 추가 — '+SIDE_LB[side],v,()=>{
    S.vendors[side].push(v);
    /* 마감대상만 보기 필터가 켜져 있으면 방금 추가한 업체가 화면에 안 보여서
       "저장이 안 된다"처럼 느껴짐 — 새 업체가 바로 보이도록 필터를 꺼준다 */
    if(tgtOnly[side]){tgtOnly[side]=false;toast('업체가 추가됐습니다 — 방금 추가한 업체가 보이도록 "마감대상만 보기"를 껐어요');}
  });
}
function editVendor(side,vid){
  const v=S.vendors[side].find(x=>x.id===vid);if(!v)return;
  vendorDlg('업체 수정',v,()=>{},()=>{
    S.vendors[side]=S.vendors[side].filter(x=>x.id!==vid);
    Object.values(S.months).forEach(mm=>{if(mm[side])delete mm[side][vid];});
  });
}

/* --- 이번달만 제외 --- 업체를 완전히 삭제하지 않고 "이번달 목록"에서만 숨김.
   다음달엔 다시 보이고, 아래 [이번달 제외 목록]에서 언제든 복원 가능. */
let selVendor={sales:new Set(),purchase:new Set()};
function toggleSelVendor(side,id,checked){checked?selVendor[side].add(id):selVendor[side].delete(id);const all=document.getElementById('vSelAll_'+side);if(all)all.checked=false;updateVendorSelCnt(side);}
function toggleAllVendorFromDom(el){
  const side=el.id.replace('vSelAll_','');
  const checked=el.checked;
  el.closest('table').querySelectorAll('td input.vsel').forEach(cb=>{
    cb.checked=checked;
    checked?selVendor[side].add(cb.dataset.id):selVendor[side].delete(cb.dataset.id);
  });
  updateVendorSelCnt(side);
}
function updateVendorSelCnt(side){const el=document.getElementById('vSelCnt_'+side);if(el)el.textContent=selVendor[side].size?`${selVendor[side].size}곳 선택됨`:'';}
function excludeSelectedVendors(side){
  const ids=[...selVendor[side]];
  if(!ids.length){toast('제외할 업체를 먼저 체크하세요');return;}
  if(!confirm(`선택한 ${ids.length}곳을 ${mon} 목록에서 제외할까요?\n(완전히 삭제되지 않습니다 — 다음달엔 다시 보이고, [이번달 제외 목록]에서 언제든 복원할 수 있습니다)`))return;
  const mm=ensureMonth(mon);
  ids.forEach(id=>{if(!mm.excluded[side].includes(id))mm.excluded[side].push(id);});
  selVendor[side].clear();
  saveDB();refreshAll();
  toast(`${ids.length}곳을 ${mon} 목록에서 제외했습니다`);
}
function restoreVendor(side,id){
  const mm=ensureMonth(mon);
  mm.excluded[side]=mm.excluded[side].filter(x=>x!==id);
  saveDB();refreshAll();showExcludedDlg(side);
}
function restoreAllVendors(side){
  const mm=ensureMonth(mon);
  mm.excluded[side]=[];
  saveDB();refreshAll();dlg.close();
  toast('전체 복원했습니다');
}
function showExcludedDlg(side){
  const mm=ensureMonth(mon);
  const ids=mm.excluded[side]||[];
  const vs=ids.map(id=>S.vendors[side].find(v=>v.id===id)).filter(Boolean);
  dlg.innerHTML=`<h3>${mon} ${SIDE_LB[side]} — 이번달 제외 목록 (${vs.length}곳)</h3>
    ${vs.length?`<div style="max-height:320px;overflow:auto;margin-top:8px">${vs.map(v=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--line2)"><span>${esc(v.name)}</span><button class="btn sm" onclick="restoreVendor('${side}','${v.id}')">복원</button></div>`).join('')}</div>`:'<div class="hint">제외된 업체가 없습니다.</div>'}
    <div class="acts">${vs.length?`<button class="btn" onclick="restoreAllVendors('${side}')">전체 복원</button>`:''}<span style="flex:1"></span><button class="btn pri" onclick="dlg.close()">닫기</button></div>`;
  dlg.showModal();
}

/* --- 처리자 일괄 변경 --- 업체별 "처리자" 항목(슬래시로 여러 명 표기 가능)에 남아있는
   이름을 한 번에 바꾼다. 인계 등으로 담당자가 바뀌었는데 업체마다 일일이 수정하기
   번거로울 때 씀. */
function bulkRenameHandler(from,to){
  from=(from||'').trim();to=(to||'').trim();
  if(!from||!to)return;
  const hasFrom=v=>(v.handler||'').split('/').map(x=>x.trim()).includes(from);
  const cnt=S.vendors.sales.filter(hasFrom).length+S.vendors.purchase.filter(hasFrom).length;
  if(!cnt){toast(`처리자에 "${from}"이(가) 있는 업체가 없습니다`);return;}
  // 되돌릴 수 없는 일괄 변경이라 몇 곳이 바뀌는지 먼저 보여주고 확인받음
  if(!confirm(`처리자 "${from}" → "${to}"\n사급·매입 합쳐 ${cnt}곳이 바뀝니다. 진행할까요?`))return;
  let n=0;
  ['sales','purchase'].forEach(side=>{
    S.vendors[side].forEach(v=>{
      const parts=(v.handler||'').split('/').map(x=>x.trim()).filter(Boolean);
      if(parts.includes(from)){
        v.handler=parts.map(x=>x===from?to:x).join('/');
        n++;
      }
    });
  });
  saveDB();refreshAll();
  toast(`${n}곳의 처리자를 "${from}"→"${to}"로 변경했습니다`);
}
function bulkRenameHandlerPrompt(){
  const from=prompt('바꿀 기존 처리자 이름을 입력하세요');
  if(from==null||!from.trim())return;
  const to=prompt(`"${from.trim()}"을(를) 무엇으로 바꿀까요?`);
  if(to==null||!to.trim())return;
  bulkRenameHandler(from,to);
}

function importJSON(inp){
  const f=inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const n=normalize(JSON.parse(rd.result));
      if(!n){toast('형식이 올바르지 않습니다');return;}
      if((S.vendors.sales.length||S.vendors.purchase.length)&&!confirm('기존 데이터를 가져온 내용으로 교체할까요?'))return;
      S=n;saveDB();refreshAll();toast('가져오기 완료 — 업체 '+(S.vendors.sales.length+S.vendors.purchase.length)+'곳');
    }catch(e){toast('JSON을 읽을 수 없습니다');}
    finally{inp.value='';}   // 취소해도 비워야 같은 파일을 다시 골랐을 때 change가 다시 발생함
  };
  rd.readAsText(f);
}
function dl(name,txt,type){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
}
function exportJSON(){dl(`마감백업-${curDate}.json`,JSON.stringify(S,null,1),'application/json')}
function exportCSV(side){
  const hd=['업체명','담당자','유형','처리자','구매팀','구매품목','보낸날짜','보낸방식',...STEPS[side],'비고',...(side==='purchase'?['구매팀행']:[]),'진행률','상태','지연단계'];
  const lines=[hd.join(',')];
  S.vendors[side].forEach(v=>{
    const e=entryRO(side,v.id);
    const cell=s=>'"'+(s||'').toString().replace(/"/g,'""')+'"';
    const status=side==='purchase'&&e.toBuyer?'구매팀 처리':pct(side,e)===1?'완료':'미완';
    lines.push([v.name,v.mgr,v.type,v.handler,v.buyer,v.items,e.sent,e.via,...e.st.slice(0,STEPS[side].length).map(x=>x?'O':''),e.note,...(side==='purchase'?[e.toBuyer?'O':'']:[]),Math.round(pct(side,e)*100)+'%',status,delayStep(side,e)].map(cell).join(','));
  });
  dl(`${side==='sales'?'사급매출마감':'매입마감'}-${mon}.csv`,'﻿'+lines.join('\r\n'),'text/csv');
}
function resetMonth(){

  // 체크만 비우고 마감대상 업로드·제외 목록은 남김 — 통째로 바꾸면 이후 업로드가 TypeError로 조용히 실패했음
  const mm=ensureMonth(mon);mm.sales={};mm.purchase={};
  saveDB();refreshAll();toast(mon+' 체크 전체 초기화됨');
}
function resetSide(side){

}

/* 체크박스 사이 방향키 이동 — 스페이스바 체크/해제는 브라우저 기본 동작이라 손댈 필요 없음.
   위/아래는 같은 열(같은 칸 위치)의 다른 행으로, 좌/우는 같은 행의 다른 체크박스로 이동.
   표가 통째로 다시 그려져도 document에 한 번만 걸어두면 계속 동작함. */
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(!(t instanceof HTMLInputElement)||t.type!=='checkbox')return;
  const vert=e.key==='ArrowUp'?-1:e.key==='ArrowDown'?1:0;
  const horiz=e.key==='ArrowLeft'?-1:e.key==='ArrowRight'?1:0;
  if(!vert&&!horiz)return;
  const tr=t.closest('tr'),table=tr&&tr.closest('table');
  if(!table)return;
  if(vert){
    const td=t.closest('td')||t.closest('th');if(!td)return;
    const ci=td.cellIndex;
    const rows=[...table.rows];
    const ri=rows.indexOf(tr);
    for(let r=ri+vert;r>=0&&r<rows.length;r+=vert){
      const cell=rows[r].cells[ci];
      const cb=cell&&cell.querySelector('input[type=checkbox]');
      if(cb){e.preventDefault();cb.focus();return;}
    }
  }else{
    const cbs=[...tr.querySelectorAll('input[type=checkbox]')];
    const next=cbs[cbs.indexOf(t)+horiz];
    if(next){e.preventDefault();next.focus();}
  }
});
refreshAll();
sbInit();
